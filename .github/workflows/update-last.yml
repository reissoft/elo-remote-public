name: Promote stable release to last
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to promote (vX.Y.Z)
        required: true
permissions:
  contents: write
concurrency:
  group: promote-last
  cancel-in-progress: false
jobs:
  promote:
    if: github.event_name == 'workflow_dispatch' || (github.event.release.tag_name != 'last' && !github.event.release.prerelease && !github.event.release.draft)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'cryptography>=44,<51'
      - name: Verify and promote signed assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: python scripts/promote_last.py
